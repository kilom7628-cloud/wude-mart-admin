<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Wude Mart — Executive Admin Console</title>
  <meta name="description" content="Administrative console for Wude Mart e-commerce platform"/>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#06080d",
            "primary-container": "#1e2025",
            "on-primary": "#ffffff",
            "on-primary-container": "#86878d",
            "secondary": "#555f6d",
            "secondary-container": "#d6e0f1",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#596372",
            "surface": "#f9f9ff",
            "surface-dim": "#d3daea",
            "surface-bright": "#f9f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f0f3ff",
            "surface-container": "#e7eefe",
            "surface-container-high": "#e2e8f8",
            "surface-container-highest": "#dce2f3",
            "on-surface": "#151c27",
            "on-surface-variant": "#46474b",
            "outline": "#76777b",
            "outline-variant": "#c6c6cb",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "tertiary": "#000913",
            "tertiary-container": "#002238",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#218ed2"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "space-2xs": "0.125rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-lg": "1rem",
            "space-xl": "1.5rem",
            "space-2xl": "2rem",
            "gutter": "1rem",
            "gutter-desktop": "1.5rem",
            "margin": "1rem",
            "margin-desktop": "2rem"
          },
          fontFamily: {
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"],
            "display-lg": ["Inter", "sans-serif"],
            "tabular-md": ["Inter", "monospace"],
            "tabular-sm": ["Inter", "monospace"]
          },
          fontSize: {
            "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
            "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
            "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0.005em", fontWeight: "400" }],
            "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-sm": ["16px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }],
            "label-md": ["13px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "600" }],
            "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "tabular-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "500" }],
            "tabular-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/src/styles.css"/>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
